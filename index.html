<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QA Browser Playground</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<h1>QA Browser Playground</h1>

<section class="card">
<h2>Browser / Headless Diagnostics</h2>

<table id="browserInfo"></table>

<h3 id="headlessResult"></h3>

</section>


<section class="card">

<h2>Incognito / Storage Validation</h2>

<input id="storageInput" placeholder="Enter value">

<br>

<button onclick="saveStorage()">
Save LocalStorage
</button>

<button onclick="loadStorage()">
Load LocalStorage
</button>

<button onclick="clearStorage()">
Clear
</button>

<p id="storageStatus"></p>

</section>


<section class="card">

<h2>Geolocation</h2>

<button onclick="requestLocation()">
Request Location
</button>

<p id="geoStatus"></p>

</section>


<section class="card">

<h2>Opacity Visibility</h2>


<div class="test-box opacity100">
Opacity 1
</div>


<div class="test-box opacity50">
Opacity 0.5
</div>


<div class="test-box opacity01">
Opacity 0.01
</div>


<div class="test-box opacity0">
Opacity 0
</div>


</section>



<section class="card long-page">

<h2>Full Page Screenshot Test</h2>


<p>
Top of page
</p>


<div class="space"></div>


<p>
BOTTOM OF PAGE
</p>


</section>



<script src="script.js"></script>


</body>
</html>
